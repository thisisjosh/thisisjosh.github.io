## Debian 13 (trixie) media server
##
## This installs XFCE, XRDP, SSH, fail2ban, VLC, Python and Arduino support.
## Chrome, VSCodium, uv, Tailscale, the enable-gui/disable-gui commands and the
## `h` cheat sheet are installed afterwards by deb/media/setup.sh from a normal
## login:
##
##   wget -qO- https://www.optimumunknown.com/deb/media/setup.sh | bash
##
## The disk is partitioned with plain LVM. There is no full-disk encryption.

## Locale and keyboard

d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

## Network

d-i netcfg/enable boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/get_domain string optimumunknown.com

## User account

d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Josh
d-i passwd/username string jdf

## Time

d-i time/zone select US/Pacific

## Partitioning

# Plain LVM using the whole target disk; no encryption passphrase.
# This can erase existing data on the disk selected by the installer.
d-i partman-auto/method string lvm
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/guided_size string max

d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

## Packages and access

# Install the remote desktop, SSH, fail2ban, media and Python pieces up front.
# Chrome, VSCodium, uv and Tailscale come from deb/media/setup.sh after boot.
d-i pkgsel/include string sudo openssh-server xrdp xorgxrdp dbus-x11 fail2ban vlc python3 python3-pip python3-venv arduino picocom curl ca-certificates gnupg usbutils

d-i tasksel/first multiselect standard, xfce-desktop

# Give jdf sudo, SSH and serial (dialout) access, and start the services at boot.
d-i preseed/late_command string in-target groupadd --force ssh && in-target usermod -aG sudo,ssh,dialout jdf && in-target systemctl enable ssh xrdp fail2ban

## Boot loader

d-i grub-installer/only_debian boolean true
