## Locale and keyboard

# Use US English and generate its UTF-8 locale.
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

## Network

# Configure networking and automatically select an interface with link.
d-i netcfg/enable boolean true
d-i netcfg/choose_interface select auto

# Leave the hostname unset so the installer prompts; DHCP may suggest a default.
d-i netcfg/get_domain string optimumunknown.com

## User account

# Disable direct root login; administer the system through sudo as jdf.
d-i passwd/root-login boolean false
# Create the regular account below and prompt for its password during setup.
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Josh
d-i passwd/username string jdf

## Time

# Set the installed system's timezone.
d-i time/zone select US/Pacific

## Partitioning

# Automatically create an encrypted LVM layout using the whole target disk.
# This can erase existing data on the disk selected by the installer.
d-i partman-auto/method string crypto
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/guided_size string max

# Leave the encryption passphrase unset so the installer prompts for it.
d-i partman-crypto/confirm boolean true

# Do not overwrite every sector before creating the encrypted volume.
d-i partman-auto-crypto/erase_disks boolean false

# Remove old LVM/RAID metadata and confirm the proposed partition layout.
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

## Packages and access

# Install sudo and the OpenSSH server.
d-i pkgsel/include string sudo openssh-server

# Install Debian's standard system utilities and XFCE desktop tasks.
tasksel tasksel/first multiselect standard, xfce-desktop

# Create the ssh group if needed, add jdf to sudo and ssh, and enable SSH at boot.
d-i preseed/late_command string in-target groupadd --force ssh && in-target usermod -aG sudo,ssh jdf && in-target systemctl enable ssh

## Boot loader

# Install GRUB automatically when Debian is the only detected operating system.
d-i grub-installer/only_debian boolean true

